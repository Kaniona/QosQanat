name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qosqanat
          POSTGRES_PASSWORD: qosqanat123
          POSTGRES_DB: qosqanat
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint --if-present

    - name: Run tests
      run: npm test --if-present
      env:
        DATABASE_URL: postgresql://qosqanat:qosqanat123@localhost:5432/qosqanat
        REDIS_URL: redis://localhost:6379

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      if: always()
      with:
        args: --severity-threshold=high

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/qosqanat-api:latest
          ${{ secrets.DOCKER_USERNAME }}/qosqanat-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Heroku
      uses: akhileshns/heroku-deploy@v3.12.12
      if: secrets.HEROKU_API_KEY != ''
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}

    - name: Deploy to Railway
      if: secrets.RAILWAY_TOKEN != ''
      run: |
        npm install -g @railway/cli
        railway link --token ${{ secrets.RAILWAY_TOKEN }}
        railway up

  notify:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: always()

    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      if: secrets.SLACK_WEBHOOK != ''
      with:
        status: ${{ job.status }}
        text: 'CI/CD Pipeline: ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
